[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brainchimp"
version = "0.0.1"
description = "Fine-tuning BrainChop's MindGrab skull-stripping model for macaque MRI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    # 0.2.5 is the last release that runs custom models (--custom); newer
    # releases (brainchop-core 1.x) run only their embedded models.
    "brainchop == 0.2.5",
    "matplotlib",
    "pyvista",
    "nibabel >= 5.2",
    "numpy",
    "pandas",
    "scipy",
    "torch >= 2.4",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "ruff == 0.17.6",
]

[project.urls]
Repository = "https://github.com/oesteban/mindgrab-brainchimp"

[tool.hatch.build.targets.wheel]
packages = ["src/brainchimp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Long lines are left to `ruff format`; docstrings and URLs may exceed the limit.
ignore = ["E501"]

[tool.ruff.format]
# Markdown (reports, the primer) is not formatted: its code blocks are illustrations.
exclude = ["*.md"]
